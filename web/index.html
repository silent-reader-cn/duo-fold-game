<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<title>Duo Fold · 折叠耐力测试</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- 启动守卫：模块加载失败（缓存混版 / WebGL 不可用 / 语法不支持）时把真实错误显示出来。
       这段是内联脚本，不经过模块缓存，模块全挂它也能跑 -->
  <script>
  (function () {
    var BUILD = '2026-10-27a';
    window.__duoBuild = BUILD;
    var box = null;

    function ensureBox() {
      if (!box) {
        box = document.createElement('div');
        box.id = 'bootErr';
        box.setAttribute('role', 'alert');
        document.body.appendChild(box);
      }
      return box;
    }

    // 诊断条：错误原文 + 当前 build，方便一眼区分"旧缓存"和"设备不支持"
    function show(msg) {
      var b = ensureBox();
      b.textContent = '启动失败 build ' + BUILD + '：' + msg;
      b.hidden = false;
      if (!document.getElementById('bootRetry')) {
        var btn = document.createElement('button');
        btn.id = 'bootRetry';
        btn.type = 'button';
        btn.textContent = '重试';
        b.appendChild(btn);
      }
    }
    window.__bootErr = show;

    window.addEventListener('error', function (e) {
      var t = e.target;
      if (t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
        show('资源加载失败 ' + (t.src || t.href || ''));
        return;
      }
      show((e.message || '未知错误') +
        (e.filename ? ' @ ' + String(e.filename).split('/').pop() + ':' + e.lineno : ''));
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      show(String((r && (r.message || r)) || 'Promise 异常'));
    });
    setTimeout(function () {
      if (!window.__duo) probeModules();
    }, 3500);

    // 逐个探测模块文件：能明确说出"哪个文件没取到"，而不是让玩家猜缓存
    var FILES = [
      './src/main.js', './src/logic.js', './src/phone.js',
      './src/card.js', './src/achievements.js', './vendor/three.module.js',
    ];
    function probeModules() {
      Promise.all(FILES.map(function (f) {
        return fetch(f, { cache: 'no-store' }).then(function (r) {
          return r.ok ? null : f + ' → HTTP ' + r.status;
        }).catch(function (e) {
          return f + ' → ' + (e && e.message ? e.message : '请求失败');
        });
      })).then(function (list) {
        var bad = list.filter(Boolean);
        show(bad.length
          ? '这些脚本没取到：' + bad.join('；')
          : '脚本都取到了但没跑起来（多半是浏览器内核或 WebGL 的问题）');
      }).catch(function () {
        show('主模块没跑起来，且探测脚本也失败了');
      });
    }

    // 重试：带时间戳重新请求文档；服务端 no-store 保证脚本也跟着重取
    document.addEventListener('click', function (e) {
      if (e.target && e.target.id === 'bootRetry') {
        location.href = location.pathname + '?r=' + Date.now();
      }
    });
  })();
  </script>

  <div class="bg-fx" aria-hidden="true">
    <div class="orb o1"></div>
    <div class="orb o2"></div>
    <div class="orb o3"></div>
    <canvas id="dust" class="dust"></canvas>
  </div>
  <canvas id="scene"></canvas>

  <div class="ui">
   <div class="hud-panel">
    <header class="hud">
      <div class="brand">DUO FOLD<em>折叠耐力测试</em></div>
      <div class="hud-right">
        <div class="folds">折叠 <b id="foldCount">0</b> 次</div>
        <button id="btnBook" class="book-btn">手册</button>
      </div>
    </header>

    <div class="stagetag">
      <div class="stage-badge"><span id="stageBadge">01</span></div>
      <div class="stage-main">
        <div class="stage-row">
          <h1 id="stageName">全新未拆封</h1>
          <div id="stageSub">STAGE 01 / 10</div>
        </div>
        <div class="stage-bar" id="stageBar"></div>
      </div>
    </div>

    <div class="traits-wrap">
      <div class="traits-head">
        <span id="traitCount">词条 0 / 9</span>
      </div>
      <div class="traits" id="traits"></div>
    </div>
   </div>
    <div class="swipe-hint" id="swipeHint" aria-hidden="true">
      <div class="sh-step">
        <div class="sh-lane"><i class="sh-dot"></i></div>
        <div class="sh-chev"><i>›</i><i>›</i><i>›</i></div>
        <div class="sh-txt">
          <b>向右滑动</b>
          <em>按住机身 · 掰出第一折</em>
        </div>
      </div>
      <div class="sh-step sh-step-hold">
        <div class="sh-ring"></div>
        <div class="sh-txt">
          <b>长按不动</b>
          <em>自动连续折叠 · 直到报废</em>
        </div>
      </div>
    </div>

    <div class="auto-chip" id="autoChip" hidden>
      <i></i><span>自动折叠中 · 点一下屏幕停止</span>
    </div>

    <footer class="panel">
      <div class="log" id="log"></div>
      <div class="risk" id="risk"></div>
      <div class="care-note" id="careNote" hidden>
        <div class="cn-head">本机最高 <b id="cnBest">—</b></div>
        <div class="cn-rule" id="cnRule">
          <i data-lv="2">8 阶 · 2 次</i><i data-lv="3">9 阶 · 3 次</i><i data-lv="4">10 阶 · 4 次</i>
        </div>
      </div>
      <div class="items">
        <button id="btnFan" data-kind="fan">吹风机<b>2</b></button>
        <button id="btnSand" data-kind="sand">沙子<b>2</b></button>
        <button id="btnAC">延保<b id="acSub">续命 ×1</b></button>
      </div>
      <button id="btnStop" class="stop">收手 · 出成就卡</button>
    </footer>

  </div>

  <div class="flash" id="flash"></div>

  <div class="book" id="book" hidden>
    <div class="book-card">
      <button class="book-close" id="closeBook" aria-label="关闭">✕</button>

      <div class="book-top">
        <div class="book-ring">
          <svg viewBox="0 0 72 72">
            <circle class="ring-bg" cx="36" cy="36" r="30"></circle>
            <circle class="ring-fg" id="ringFg" cx="36" cy="36" r="30"></circle>
          </svg>
          <span id="ringText">0%</span>
        </div>
        <div class="book-heading">
          <h2>成就手册</h2>
          <p id="bookProgress">已解锁 0 / 25</p>
        </div>
      </div>

      <div class="book-stats" id="bookStats"></div>
      <div class="book-scroll" id="bookGrid"></div>
    </div>
  </div>

  <div class="modal" id="cardModal" hidden>
    <div class="sheet">
      <img id="cardImg" alt="成就卡片">
      <div class="acts">
        <a id="dlCard" download>保存图片</a>
        <button id="closeCard">再来一台</button>
      </div>
    </div>
  </div>

  <script type="importmap">
  { "imports": { "three": "./vendor/three.module.js" } }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
